name: glucotrack
description: Non-Invasive PPG Glucometer companion app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localisation (RTL Arabic support)
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local storage
  sqflite: ^2.4.2
  path: ^1.9.0
  shared_preferences: ^2.5.4

  # BLE
  flutter_blue_plus: ^1.36.8

  # Charts
  fl_chart: ^0.68.0

  # PDF export
  pdf: ^3.12.0
  printing: ^5.14.3

  # Notifications
  flutter_local_notifications: ^17.2.4

  # Timezone — required by flutter_local_notifications zonedSchedule
  timezone: ^0.9.4

  # Device local timezone name — required by main.dart before scheduling
  flutter_timezone: ^3.0.0

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Navigation
  go_router: ^14.8.1

  # Internationalisation
  intl: ^0.20.2

  # Icons & SVG
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.5.4
  riverpod_generator: ^2.6.5
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# ── App icon configuration ─────────────────────────────────────
# Glucose_Icon3.png = circular icon → used as app icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/Glucose_Icon3.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/Glucose_Icon3.png"

# ── Splash screen configuration ────────────────────────────────
# Glucose_Icon2.png = wide logo → used as splash screen image
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/Glucose_Icon2.png"
  color_dark: "#FFFFFF"
  image_dark: "assets/icon/Glucose_Icon2.png"
  android: true
  ios: true
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
  fonts:
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf